services:
  web:
    build: .
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cvfit:${POSTGRES_PASSWORD:-cvfit}@db:5432/cvfit
      STORAGE_DIR: /data
      DEV_STAFF_BYPASS: ${DEV_STAFF_BYPASS:-false}
    volumes:
      - ./storage:/data
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvfit}
      POSTGRES_DB: cvfit
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvfit"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  db_data:
