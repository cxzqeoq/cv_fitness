{% extends "auth/layout.html" %}
{% block title %}Регистрация ученика · CV Fitness{% endblock %}
{% block content %}
<div><h1 class="text-xl font-semibold">Регистрация ученика</h1><p class="mt-1 text-sm text-slate-400">Создайте личный кабинет для своих тренировок.</p></div>
<form action="/student/register" method="post" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="block text-xs text-slate-400">Имя и фамилия<input name="name" maxlength="120" autocomplete="name" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-500/50"></label><label class="block text-xs text-slate-400">Email<input name="email" type="email" maxlength="320" autocomplete="email" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-500/50"></label><label class="block text-xs text-slate-400">Пароль<span class="float-right text-slate-600">минимум 10 символов</span><input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-500/50"></label><label class="block text-xs text-slate-400">Повторите пароль<input name="password_confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-500/50"></label><button class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-violet-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-violet-500"><i data-lucide="user-plus" class="w-4 h-4"></i>Создать аккаунт</button></form>
<p class="mt-5 text-center text-xs text-slate-500">Уже зарегистрированы? <a href="/student/login" class="text-violet-400 hover:text-violet-300">Войти</a></p>
{% endblock %}
