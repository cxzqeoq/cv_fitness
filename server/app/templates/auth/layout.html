<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Вход · CV Fitness{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:"Inter",system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <a href="/" class="mb-6 flex items-center justify-center gap-2"><span class="w-7 h-7 rounded-md bg-violet-500"></span><span class="font-semibold">cv.fitness</span></a>
    <section class="rounded-2xl border border-white/10 bg-slate-900 p-6 shadow-2xl shadow-black/30">
      {% if error %}<div class="mb-4 rounded-lg border border-red-400/20 bg-red-500/10 px-3 py-2.5 text-sm text-red-200 flex gap-2"><i data-lucide="circle-alert" class="w-4 h-4 mt-0.5 shrink-0"></i><span>{{ error }}</span></div>{% endif %}
      {% block content %}{% endblock %}
    </section>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
