<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ video.original_name if video else "Тренировка" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center">
{% if not video %}
<p class="p-6 text-slate-500">Видео не найдено.</p>
{% else %}
<div class="w-full max-w-2xl p-4">
  <div class="relative w-full">
    <video id="player" src="/api/videos/{{ video.id }}/file" controls playsinline
           class="w-full rounded"></video>
    <canvas id="overlay" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
  </div>

  <div id="seg-bar" class="relative h-2 mt-2 rounded bg-slate-800 overflow-hidden"></div>

  <div class="mt-3 space-y-1">
    <div id="seg-label" class="text-emerald-400 font-medium"></div>
    <div id="subtitle" class="text-slate-200"></div>
  </div>
</div>

<script type="module">
  import { initPlayer } from "/static/player.js";
  initPlayer({{ video.id }});
</script>
{% endif %}
</body>
</html>
